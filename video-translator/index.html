<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم وميدبلج الفيديوهات المجاني</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }
        h2 { text-align: center; margin-top: 0; color: #38bdf8; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            background: #000;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #0f172a;
            font-size: 14px;
            text-align: center;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎬 مدبلج الفيديوهات (Gemini المجاني)</h2>
    <div class="input-group">
        <label>مفتاح Gemini API (مجاني):</label>
        <input type="text" id="apiKey" placeholder="ضع مفتاح Gemini الخاص بك هنا">
    </div>
    <div class="input-group">
        <label>اختر الفيديو من هاتفك (الحد الأدنى 68 ثانية):</label>
        <input type="file" id="videoInput" accept="video/*">
    </div>
    <video id="videoPreview" controls style="display:none;"></video>
    <button id="startBtn" onclick="processVideo()">✨ بدء الدبلجة للفرنسية (مجاناً)</button>
    <div class="status" id="statusBox">جاهز لبدء العمل...</div>
</div>
<script>
    const videoInput = document.getElementById('videoInput');
    const videoPreview = document.getElementById('videoPreview');
    const statusBox = document.getElementById('statusBox');
    const startBtn = document.getElementById('startBtn');
    let videoDuration = 0;

    videoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const objectUrl = URL.createObjectURL(file);
            videoPreview.src = objectUrl;
            videoPreview.style.display = 'block';
            videoPreview.onloadedmetadata = function() {
                videoDuration = videoPreview.duration;
                if (videoDuration < 68) {
                    statusBox.innerText = `⚠️ تنبيه: مدة الفيديو (${Math.floor(videoDuration)} ثانية) أقل من الحد الأدنى المطلوبة (68 ثانية)!`;
                    startBtn.disabled = true;
                } else {
                    statusBox.innerText = `✅ مدة الفيديو مقبولة (${Math.floor(videoDuration)} ثانية). جاهز للدبلجة.`;
                    startBtn.disabled = false;
                }
            };
        }
    });

    async function processVideo() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const file = videoInput.files[0];
        if (!apiKey) { alert('يرجى إدخال مفتاح Gemini API المجاني أولاً!'); return; }
        if (!file) { alert('يرجى اختيار فيديو من الهاتف!'); return; }
        if (videoDuration < 68) { alert('عذراً، يجب أن يكون الفيديو 68 ثانية على الأقل!'); return; }

        startBtn.disabled = true;
        statusBox.innerText = '⌛ جاري تحضير الملف وقراءته...';
        try {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                statusBox.innerText = '🤖 جاري الاستماع للنسخ العربي وترجمته للفرنسية بواسطة Gemini...';
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Translate the audio spoken in this video directly into natural French text for dubbing. Return only the French translation without any notes." },
                                { inline_data: { mime_type: file.type || "video/mp4", data: base64Data } }
                            ]
                        }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const frenchText = data.candidates[0].content.parts[0].text;
                    statusBox.innerText = '🔊 جاري تشغيل الدبلجة الصوتية بالفرنسية...';
                    speakFrench(frenchText);
                } else {
                    throw new Error('لم ينجح النظام في إستخراج الترجمة.');
                }
            };
        } catch (err) {
            console.error(err);
            statusBox.innerText = '❌ حدث خطأ، تأكد من صحة المفتاح وحجم الفيديو.';
            startBtn.disabled = false;
        }
    }

    function speakFrench(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.lang.includes('fr') && (v.name.includes('Male') || v.name.includes('Nicolas') || v.name.includes('Paul')));
            if (maleVoice) utterance.voice = maleVoice;
            utterance.onend = () => {
                statusBox.innerText = '✅ اكتملت الدبلجة بنجاح!';
                startBtn.disabled = false;
            };
            window.speechSynthesis.speak(utterance);
            videoPreview.play();
        } else {
            statusBox.innerText = '⚠️ متصفحك لا يدعم توليد الصوت المباشر.';
            startBtn.disabled = false;
        }
    }
</script>
</body>
</html>
